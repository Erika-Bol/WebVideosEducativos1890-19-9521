<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | EduPagina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="index.html" class="back-link">← Volver al Inicio</a>
        
        <div class="auth-box">
            <h2 class="logo text-center">EduPagina</h2>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-login">Iniciar Sesión</button>
                <button class="tab-btn" id="tab-register">Registrarse</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-id">Carnet o Correo Electrónico</label>
                    <input type="text" id="login-id" required placeholder="Ej. 1234-56-7890 o email@dominio.com">
                </div>
                <div class="form-group">
                    <label for="login-pin">Contraseña (PIN Numérico)</label>
                    <input type="password" id="login-pin" required pattern="\d+" title="Solo se permiten números" placeholder="Introduce tu PIN">
                </div>
                <div id="login-alert" class="alert hidden"></div>
                <button type="submit" class="btn-primary full-width">Ingresar</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo</label>
                    <input type="text" id="reg-nombre" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="reg-carnet">Carnet Universitario</label>
                    <input type="text" id="reg-carnet" required pattern="\d{4}-\d{2}-\d{4}" title="Formato requerido: 0000-00-0000" placeholder="0000-00-0000">
                    <small class="hint">Formato requerido: 0000-00-0000</small>
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="estudiante@dominio.com">
                </div>
                <div class="form-group">
                    <label for="reg-pin">Contraseña (PIN Numérico)</label>
                    <input type="password" id="reg-pin" required pattern="\d+" title="Debe ser estrictamente numérico, sin letras ni espacios" placeholder="Solo números">
                    <small class="hint">Solo números, sin espacios ni letras.</small>
                </div>
                <div id="register-alert" class="alert hidden"></div>
                <button type="submit" class="btn-primary full-width">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // UI Logic for Auth Page
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const loginAlert = document.getElementById('login-alert');
        const registerAlert = document.getElementById('register-alert');

        // Toggle Tabs
        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.classList.add('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            registerForm.classList.remove('active');
            loginAlert.className = 'alert hidden';
            registerAlert.className = 'alert hidden';
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerForm.classList.add('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            loginForm.classList.remove('active');
            loginAlert.className = 'alert hidden';
            registerAlert.className = 'alert hidden';
        });

        // Form Submissions
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            
            const result = AuthAPI.loginUser(id, pin);
            
            if (result.success) {
                showAlert(loginAlert, result.message, 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showAlert(loginAlert, result.message, 'error');
            }
        });

        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('reg-nombre').value.trim();
            const carnet = document.getElementById('reg-carnet').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pin = document.getElementById('reg-pin').value.trim();
            
            const result = AuthAPI.registerUser(nombre, carnet, email, pin);
            
            if (result.success) {
                showAlert(registerAlert, result.message, 'success');
                registerForm.reset();
                setTimeout(() => {
                    tabLogin.click(); // Switch to login tab
                }, 2000);
            } else {
                showAlert(registerAlert, result.message, 'error');
            }
        });

        function showAlert(element, message, type) {
            element.textContent = message;
            element.className = `alert ${type}`;
        }
    </script>
</body>
</html>
